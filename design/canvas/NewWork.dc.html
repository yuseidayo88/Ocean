<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500&amp;display=swap">
  <style>
    body { margin: 0; background: #000000; -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
    a { color: #4C8DF6; } a:hover { color: #7BADF9; }
  </style>
</helmet>
<div style="position: relative; width: 1440px; height: 900px; box-sizing: border-box; display: flex; background: #0A0A0A; color: #EDEDED; font-family: -apple-system, ui-sans-serif, system-ui, 'Segoe UI', Helvetica, 'Noto Sans JP', Arial, sans-serif; font-size: 13px; line-height: 20px; overflow: hidden;">

  <!-- Rail -->
  <div style="width: 260px; flex-shrink: 0; box-sizing: border-box; display: flex; flex-direction: column; gap: 18px; padding: 14px 12px; background: #141414; border-right: 1px solid #232323;">
    <div style="display: flex; align-items: center; gap: 10px; padding: 0 4px; height: 26px;">
      <span style="width: 9px; height: 9px; border-radius: 999px; background: #2E2E2E;"></span>
      <span style="width: 9px; height: 9px; border-radius: 999px; background: #2E2E2E;"></span>
      <span style="width: 9px; height: 9px; border-radius: 999px; background: #2E2E2E;"></span>
      <div style="flex: 1;"></div>
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#6E6E6E" stroke-width="1.5" stroke-linecap="round"><circle cx="12" cy="8.5" r="3.4"/><path d="M5.5 19.5c0-3.3 2.9-5.6 6.5-5.6s6.5 2.3 6.5 5.6"/></svg>
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#6E6E6E" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9.5 6 6 6-6"/></svg>
    </div>

    <div style="display: flex; gap: 8px;">
      <span style="width: 46px; height: 46px; border-radius: 12px; background: #10262B; border: 1px solid #1C4148; display: inline-flex; align-items: center; justify-content: center;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#3ECBE0" stroke-width="1.5"><circle cx="12" cy="12" r="3"/><circle cx="12" cy="12" r="7.5"/></svg>
      </span>
      <span style="width: 46px; height: 46px; border-radius: 12px; background: #221334; border: 1px solid #3B1F58; display: inline-flex; align-items: center; justify-content: center;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#B06CF5" stroke-width="1.5" stroke-linejoin="round"><path d="M12 4.5 19 10l-7 5.5L5 10z"/><path d="m5 15 7 5.5L19 15"/></svg>
      </span>
      <span style="width: 46px; height: 46px; border-radius: 12px; background: #151833; border: 1px solid #26295C; display: inline-flex; align-items: center; justify-content: center;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#7C82F0" stroke-width="1.5"><rect x="4.5" y="4.5" width="6" height="6" rx="1.2"/><rect x="13.5" y="4.5" width="6" height="6" rx="1.2"/><rect x="4.5" y="13.5" width="6" height="6" rx="1.2"/><rect x="13.5" y="13.5" width="6" height="6" rx="1.2"/></svg>
      </span>
      <span style="width: 46px; height: 46px; border-radius: 12px; border: 1px dashed #333333; display: inline-flex; align-items: center; justify-content: center;">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#5F5F5F" stroke-width="1.6" stroke-linecap="round"><path d="M12 5.5v13M5.5 12h13"/></svg>
      </span>
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px;">
      <div style="display: flex; align-items: center; padding: 0 4px;">
        <span style="color: #8B8B8B;">Work</span>
        <div style="flex: 1;"></div>
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#6E6E6E" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 6.5h5.6l1.6 2h9.8v9.5a1.5 1.5 0 0 1-1.5 1.5H5a1.5 1.5 0 0 1-1.5-1.5z"/><path d="M12 11.5v5M9.5 14h5"/></svg>
      </div>
      <div style="display: flex; align-items: center; gap: 10px; height: 32px; padding: 0 10px; border-radius: 8px;">
        <span style="width: 8px; height: 8px; border-radius: 999px; background: #3FB950;"></span>
        <span style="color: #B8B8B8; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">日本語学習サービス</span>
      </div>
      <div style="display: flex; align-items: center; gap: 10px; height: 32px; padding: 0 10px; border-radius: 8px;">
        <span style="width: 8px; height: 8px; border-radius: 999px; background: #333333;"></span>
        <span style="color: #8B8B8B; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">ECサイトの改善</span>
      </div>
      <div style="display: flex; align-items: center; gap: 10px; height: 32px; padding: 0 10px; border-radius: 8px;">
        <span style="width: 8px; height: 8px; border-radius: 999px; background: #333333;"></span>
        <span style="color: #8B8B8B; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">採用ページのリニューアル</span>
      </div>
    </div>

    <div style="flex: 1;"></div>

    <div style="display: flex; align-items: center; gap: 10px; height: 34px; padding: 0 6px;">
      <span style="width: 22px; height: 22px; border-radius: 999px; background: #2E2E2E; display: inline-flex; align-items: center; justify-content: center; font-size: 11px;">Y</span>
      <span style="color: #8B8B8B;">あなた</span>
      <div style="flex: 1;"></div>
      <span style="color: #5F5F5F; font-variant-numeric: tabular-nums;">812 / 3,000</span>
    </div>
  </div>

  <!-- Centre -->
  <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; background: #0D0D0D;">
    <div style="height: 46px; flex-shrink: 0; display: flex; align-items: center; gap: 12px; padding: 0 14px; border-bottom: 1px solid #1C1C1C;">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#6E6E6E" stroke-width="1.5"><rect x="3.5" y="5" width="17" height="14" rx="2.5"/><path d="M9.5 5v14"/></svg>
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#3A3A3A" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="m14 6-6 6 6 6"/></svg>
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#3A3A3A" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="m10 6 6 6-6 6"/></svg>
      <span style="margin-left: 4px;">統括AI</span>
      <span style="color: #5F5F5F;">/ 新しいWork</span>
      <div style="flex: 1;"></div>
      <span style="color: #5F5F5F;">⌘L で入力へ</span>
    </div>

    <div style="flex: 1; min-height: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 26px; padding: 0 40px 40px;">

      <div style="display: flex; flex-direction: column; align-items: center; gap: 22px;">
        <div style="display: flex; gap: 10px;">
          <span style="width: 54px; height: 54px; border-radius: 14px; background: #10262B; border: 1px solid #1C4148; display: inline-flex; align-items: center; justify-content: center;">
            <svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="#3ECBE0" stroke-width="1.4"><circle cx="12" cy="12" r="3"/><circle cx="12" cy="12" r="7.5"/></svg>
          </span>
          <span style="width: 54px; height: 54px; border-radius: 14px; background: #221334; border: 1px solid #3B1F58; display: inline-flex; align-items: center; justify-content: center;">
            <svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="#B06CF5" stroke-width="1.4" stroke-linejoin="round"><path d="M12 4.5 19 10l-7 5.5L5 10z"/><path d="m5 15 7 5.5L19 15"/></svg>
          </span>
          <span style="width: 54px; height: 54px; border-radius: 14px; background: #151833; border: 1px solid #26295C; display: inline-flex; align-items: center; justify-content: center;">
            <svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="#7C82F0" stroke-width="1.4"><rect x="4.5" y="4.5" width="6" height="6" rx="1.2"/><rect x="13.5" y="4.5" width="6" height="6" rx="1.2"/><rect x="4.5" y="13.5" width="6" height="6" rx="1.2"/><rect x="13.5" y="13.5" width="6" height="6" rx="1.2"/></svg>
          </span>
          <span style="width: 54px; height: 54px; border-radius: 14px; background: #2A1A10; border: 1px solid #4A2E19; display: inline-flex; align-items: center; justify-content: center;">
            <svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="#E8A33D" stroke-width="1.4" stroke-linejoin="round"><path d="M4.5 18.5 9.8 12l3.4 3.6 5.8-8.6"/><path d="M15.6 6.8h3.9v3.9"/></svg>
          </span>
        </div>
        <span style="font-size: 26px; line-height: 36px;">何をはじめますか？</span>
      </div>

      <div style="width: 640px; box-sizing: border-box; display: flex; flex-direction: column; gap: 12px; padding: 13px 13px 11px; border-radius: 14px; background: #141414; border: 1px solid #2A2A2A;">
        <span style="color: #5F5F5F; padding: 0 2px;">やりたいことを書く、@ で資料を参照</span>
        <div style="display: flex; align-items: center; gap: 10px;">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#8B8B8B" stroke-width="1.6" stroke-linecap="round"><path d="M12 5.5v13M5.5 12h13"/></svg>
          <span style="display: inline-flex; align-items: center; gap: 6px; color: #B8B8B8;">
            統括AI
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#6E6E6E" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9.5 6 6 6-6"/></svg>
          </span>
          <span style="display: inline-flex; align-items: center; gap: 7px; color: #B8B8B8;">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#8B8B8B" stroke-width="1.7" stroke-linecap="round"><path d="M5 16v3M10 12v7M15 8v11M20 4v15"/></svg>
            じっくり
          </span>
          <div style="flex: 1;"></div>
          <span style="width: 34px; height: 34px; display: inline-flex; align-items: center; justify-content: center; border-radius: 999px; background: #3B82F6;">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V6M6 12l6-6 6 6"/></svg>
          </span>
        </div>
      </div>

      <div style="width: 640px; display: flex; gap: 10px;">
        <div style="flex: 1; display: flex; flex-direction: column; gap: 10px; padding: 13px; border-radius: 12px; background: #121212; border: 1px solid #232323;">
          <span style="width: 28px; height: 28px; border-radius: 8px; background: #10262B; display: inline-flex; align-items: center; justify-content: center;">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#3ECBE0" stroke-width="1.5" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4.5 4.5"/></svg>
          </span>
          <span>需要から探す</span>
        </div>
        <div style="flex: 1; display: flex; flex-direction: column; gap: 10px; padding: 13px; border-radius: 12px; background: #121212; border: 1px solid #232323;">
          <span style="width: 28px; height: 28px; border-radius: 8px; background: #2A1A10; display: inline-flex; align-items: center; justify-content: center;">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#E8A33D" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 18.5 9.8 12l3.4 3.6 5.8-8.6"/><path d="M15.6 6.8h3.9v3.9"/></svg>
          </span>
          <span>新規事業を立ち上げる</span>
        </div>
        <div style="flex: 1; display: flex; flex-direction: column; gap: 10px; padding: 13px; border-radius: 12px; background: #121212; border: 1px solid #232323;">
          <span style="width: 28px; height: 28px; border-radius: 8px; background: #221334; display: inline-flex; align-items: center; justify-content: center;">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#B06CF5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12a8 8 0 1 1-2.4-5.7"/><path d="M20 4.5V9h-4.5"/></svg>
          </span>
          <span>いまの事業を立て直す</span>
        </div>
      </div>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
