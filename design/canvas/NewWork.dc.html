<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500&amp;display=swap">
  <style>
    body { margin: 0; background: #000000; -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
    a { color: #4C8DF6; } a:hover { color: #7BADF9; }
  </style>
</helmet>
<div style="position: relative; width: 1440px; height: 900px; box-sizing: border-box; display: flex; background: #000000; color: #EDEDED; font-family: -apple-system, ui-sans-serif, system-ui, 'Segoe UI', Helvetica, 'Noto Sans JP', Arial, sans-serif; font-size: 13px; line-height: 20px; overflow: hidden;">

  <!-- Rail -->
  <div style="width: 260px; flex-shrink: 0; box-sizing: border-box; display: flex; flex-direction: column; gap: 14px; padding: 14px 12px; background: #141414; border-right: 1px solid #232323;">

    <div style="display: flex; align-items: center; gap: 10px; padding: 0 4px; height: 26px;">
      <span style="width: 9px; height: 9px; border-radius: 999px; background: #2E2E2E;"></span>
      <span style="width: 9px; height: 9px; border-radius: 999px; background: #2E2E2E;"></span>
      <span style="width: 9px; height: 9px; border-radius: 999px; background: #2E2E2E;"></span>
      <div style="flex: 1;"></div>
      <span style="font-size: 12px; color: #6E6E6E;">OneFound</span>
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#6E6E6E" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9.5 6 6 6-6"/></svg>
    </div>

    <div style="height: 32px; display: flex; align-items: center; gap: 9px; padding: 0 10px; border-radius: 8px; background: #1A1A1A; border: 1px solid #262626;">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#6E6E6E" stroke-width="1.7" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4 4"/></svg>
      <span style="color: #6E6E6E;">検索</span>
      <div style="flex: 1;"></div>
      <span style="color: #5F5F5F;">⌘K</span>
    </div>

    <div style="display: flex; flex-direction: column; gap: 1px;">
      <div style="display: flex; align-items: center; gap: 11px; height: 34px; padding: 0 10px; border-radius: 8px;">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#8B8B8B" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="m4 11 8-7 8 7"/><path d="M6.5 9.4V20h11V9.4"/></svg>
        <span style="color: #B8B8B8;">ホーム</span>
      </div>
      <div style="display: flex; align-items: center; gap: 11px; height: 34px; padding: 0 10px; border-radius: 8px;">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#8B8B8B" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="5.5" width="16" height="13.5" rx="2"/><path d="M4 13.2h4.2l1.5 2.2h4.6l1.5-2.2H20"/></svg>
        <span style="color: #B8B8B8;">通知</span><div style="flex: 1;"></div><span style="color: #E8A33D; font-variant-numeric: tabular-nums;">2</span>
      </div>
      <div style="display: flex; align-items: center; gap: 11px; height: 34px; padding: 0 10px; border-radius: 8px; background: #232323;">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#EDEDED" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="7.5" width="17" height="12" rx="2"/><path d="M9 7.5V6a1.8 1.8 0 0 1 1.8-1.8h2.4A1.8 1.8 0 0 1 15 6v1.5"/></svg>
        <span style="color: #EDEDED;">Work</span><div style="flex: 1;"></div><span style="width: 8px; height: 8px; border-radius: 999px; background: #3FB950;"></span>
      </div>
      <div style="display: flex; align-items: center; gap: 11px; height: 34px; padding: 0 10px; border-radius: 8px;">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#8B8B8B" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="m8.2 12.2 2.4 2.4 4.6-5"/></svg>
        <span style="color: #B8B8B8;">タスク</span>
      </div>
      <div style="display: flex; align-items: center; gap: 11px; height: 34px; padding: 0 10px; border-radius: 8px;">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#8B8B8B" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M13.5 3.5H7.4A1.9 1.9 0 0 0 5.5 5.4v13.2a1.9 1.9 0 0 0 1.9 1.9h9.2a1.9 1.9 0 0 0 1.9-1.9V8.5z"/><path d="M13.5 3.5v5h5"/></svg>
        <span style="color: #B8B8B8;">成果物</span>
      </div>
      <div style="display: flex; align-items: center; gap: 11px; height: 34px; padding: 0 10px; border-radius: 8px;">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#8B8B8B" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="9.2" cy="8.6" r="3.1"/><path d="M4 19.2c0-2.9 2.3-5.2 5.2-5.2s5.2 2.3 5.2 5.2"/><path d="M15.6 5.9a3 3 0 0 1 0 5.5M17.6 14.4c1.8.8 3 2.6 3 4.8"/></svg>
        <span style="color: #B8B8B8;">メンバー</span><div style="flex: 1;"></div><span style="color: #5F5F5F; font-variant-numeric: tabular-nums;">3</span>
      </div>
      <div style="display: flex; align-items: center; gap: 11px; height: 34px; padding: 0 10px; border-radius: 8px;">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#8B8B8B" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 6.5h15M4.5 12h15M4.5 17.5h9"/></svg>
        <span style="color: #B8B8B8;">決定事項</span>
      </div>
    </div>

    <div style="flex: 1;"></div>

    <div style="display: flex; flex-direction: column; gap: 8px; padding: 0 10px;">
      <div style="display: flex; align-items: baseline;">
        <span style="color: #8B8B8B;">クレジット</span>
        <div style="flex: 1;"></div>
        <span style="color: #B8B8B8; font-variant-numeric: tabular-nums;">812<span style="color: #5F5F5F;"> / 3,000</span></span>
      </div>
      <div style="height: 3px; border-radius: 2px; background: #232323; overflow: hidden;">
        <div style="width: 27%; height: 100%; border-radius: 2px; background: #3FB950;"></div>
      </div>
    </div>

    <div style="display: flex; align-items: center; gap: 10px; height: 36px; padding: 0 10px; border-radius: 8px;">
      <span style="width: 22px; height: 22px; border-radius: 999px; background: #2E2E2E; display: inline-flex; align-items: center; justify-content: center; font-size: 11px;">Y</span>
      <span style="color: #B8B8B8;">あなた</span>
      <div style="flex: 1;"></div>
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#6E6E6E" stroke-width="1.5" stroke-linecap="round"><circle cx="12" cy="12" r="3.2"/><path d="M12 3.2v2.2M12 18.6v2.2M3.2 12h2.2M18.6 12h2.2M5.8 5.8l1.6 1.6M16.6 16.6l1.6 1.6M18.2 5.8l-1.6 1.6M7.4 16.6l-1.6 1.6"/></svg>
    </div>
  </div>

  <!-- Centre -->
  <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; background: #000000;">
    <div style="height: 46px; flex-shrink: 0; display: flex; align-items: center; gap: 12px; padding: 0 14px; border-bottom: 1px solid #1C1C1C;">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#6E6E6E" stroke-width="1.5"><rect x="3.5" y="5" width="17" height="14" rx="2.5"/><path d="M9.5 5v14"/></svg>
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#3A3A3A" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="m14 6-6 6 6 6"/></svg>
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#3A3A3A" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="m10 6 6 6-6 6"/></svg>
      <span style="margin-left: 4px;">統括AI</span>
      <span style="color: #5F5F5F;">/ 新しいWork</span>
      <div style="flex: 1;"></div>
      <span style="color: #5F5F5F;">⌘L で入力へ</span>
    </div>

    <div style="flex: 1; min-height: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 26px; padding: 0 40px 40px;">

      <div style="display: flex; flex-direction: column; align-items: center; gap: 22px;">
        <span style="font-size: 26px; line-height: 36px;">何をはじめますか？</span>
      </div>

      <div style="width: 640px; box-sizing: border-box; display: flex; flex-direction: column; gap: 12px; padding: 13px 13px 11px; border-radius: 14px; background: #141414; border: 1px solid #2A2A2A;">
        <span style="color: #5F5F5F; padding: 0 2px;">やりたいことを書く、@ で資料を参照</span>
        <div style="display: flex; align-items: center; gap: 10px;">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#8B8B8B" stroke-width="1.6" stroke-linecap="round"><path d="M12 5.5v13M5.5 12h13"/></svg>
          <span style="display: inline-flex; align-items: center; gap: 6px; color: #B8B8B8;">
            統括AI
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#6E6E6E" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9.5 6 6 6-6"/></svg>
          </span>
          <span style="display: inline-flex; align-items: center; gap: 7px; color: #B8B8B8;">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#8B8B8B" stroke-width="1.7" stroke-linecap="round"><path d="M5 16v3M10 12v7M15 8v11M20 4v15"/></svg>
            じっくり
          </span>
          <div style="flex: 1;"></div>
          <span style="width: 34px; height: 34px; display: inline-flex; align-items: center; justify-content: center; border-radius: 999px; background: #3B82F6;">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V6M6 12l6-6 6 6"/></svg>
          </span>
        </div>
      </div>

      <div style="width: 640px; display: flex; gap: 10px;">
        <div style="flex: 1; display: flex; flex-direction: column; gap: 10px; padding: 13px; border-radius: 12px; background: #0E0E0E; border: 1px solid #232323;">
          <span style="width: 28px; height: 28px; border-radius: 8px; background: #10262B; display: inline-flex; align-items: center; justify-content: center;">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#3ECBE0" stroke-width="1.5" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4.5 4.5"/></svg>
          </span>
          <span>需要から探す</span>
        </div>
        <div style="flex: 1; display: flex; flex-direction: column; gap: 10px; padding: 13px; border-radius: 12px; background: #0E0E0E; border: 1px solid #232323;">
          <span style="width: 28px; height: 28px; border-radius: 8px; background: #2A1A10; display: inline-flex; align-items: center; justify-content: center;">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#E8A33D" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 18.5 9.8 12l3.4 3.6 5.8-8.6"/><path d="M15.6 6.8h3.9v3.9"/></svg>
          </span>
          <span>新規事業を立ち上げる</span>
        </div>
        <div style="flex: 1; display: flex; flex-direction: column; gap: 10px; padding: 13px; border-radius: 12px; background: #0E0E0E; border: 1px solid #232323;">
          <span style="width: 28px; height: 28px; border-radius: 8px; background: #221334; display: inline-flex; align-items: center; justify-content: center;">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#B06CF5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12a8 8 0 1 1-2.4-5.7"/><path d="M20 4.5V9h-4.5"/></svg>
          </span>
          <span>いまの事業を立て直す</span>
        </div>
      </div>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
